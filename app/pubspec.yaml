name: pulse
description: Pulse —— 聚合中文热榜的 iOS 阅读器
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # CupertinoIcons 的字形字体；漏了它所有系统图标都会显示成方框问号
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.3.2
  # 从「文件」App 选择 JSON（UIDocumentPicker）
  file_picker: ^8.0.6
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  share_plus: 10.1.4
  # 部分中文站点仍是 GBK/GB18030
  charset_converter: ^2.1.1
  # 站点拒绝文字抓取时，用系统 WKWebView 直接渲染原文
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/hot-sources.json
    - assets/data/sample-news.json
